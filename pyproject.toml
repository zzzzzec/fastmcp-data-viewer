[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmcp-data-viewer"
version = "0.1.0"
dependencies = [
    "fastmcp",
    "pandas",
    "pyarrow",
    "numpy",
]

[project.scripts]
data-viewer = "fastmcp_data_viewer.main:main"

[tool.setuptools.packages.find]
where = ["src"]